name: Publish Python Package and Smoke Test

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-python-package
  cancel-in-progress: false

jobs:
  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Build sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist --outdir dist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: pypi-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  build_wheels:
    name: Build wheels (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout selected revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Build wheel
        uses: pypa/cibuildwheel@v4.2.1
        env:
          MACOSX_DEPLOYMENT_TARGET: '11.0'
          CIBW_ENVIRONMENT_MACOS: MACOSX_DEPLOYMENT_TARGET=11.0
        with:
          output-dir: wheelhouse

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: pypi-wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish distributions to PyPI
    needs: [build_sdist, build_wheels]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/riley-raster
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download all distributions
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  smoke_test_published:
    name: Smoke test published package (${{ matrix.os }})
    needs: publish
    if: github.event_name == 'release'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Read published package version
        id: package_version
        shell: bash
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Create clean environment
        run: python -m venv "$RUNNER_TEMP/riley-pypi-smoke"
      - name: Install from PyPI (Linux)
        if: runner.os == 'Linux'
        run: |
          python="$RUNNER_TEMP/riley-pypi-smoke/bin/python"
          "$python" -m pip install --upgrade pip
          for attempt in 1 2 3 4 5 6 7 8; do
            "$python" -m pip install --index-url https://pypi.org/simple "riley-raster==${{ steps.package_version.outputs.version }}" && break
            [ "$attempt" -eq 8 ] && exit 1
            sleep 15
          done
      - name: Install from PyPI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $python = "$env:RUNNER_TEMP\riley-pypi-smoke\Scripts\python.exe"
          & $python -m pip install --upgrade pip
          for ($attempt = 1; $attempt -le 8; $attempt++) {
            & $python -m pip install --index-url https://pypi.org/simple "riley-raster==${{ steps.package_version.outputs.version }}"
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 8) { exit 1 }
            Start-Sleep -Seconds 15
          }
      - name: Verify installed package (Linux)
        if: runner.os == 'Linux'
        working-directory: ${{ runner.temp }}
        run: "$RUNNER_TEMP/riley-pypi-smoke/bin/python -c 'import riley; print(riley.__file__)'"
      - name: Verify installed package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& "$env:RUNNER_TEMP\riley-pypi-smoke\Scripts\python.exe" -c "import riley; print(riley.__file__)"'
      - name: Run demos (Linux)
        if: runner.os == 'Linux'
        working-directory: ${{ runner.temp }}
        run: |
          for demo in demo0_quickstart demo1_sphere200 demo2_psf demo3_rabbits demo6_dicuq demo7_dic_from_exodus demo8_stereocal demo9_feature_zoo; do
            "$RUNNER_TEMP/riley-pypi-smoke/bin/python" -m "riley.pydemos.$demo"
          done
      - name: Run demos (Windows)
        if: runner.os == 'Windows'
        working-directory: ${{ runner.temp }}
        shell: pwsh
        run: |
          $python = "$env:RUNNER_TEMP\riley-pypi-smoke\Scripts\python.exe"
          $demos = 'demo0_quickstart','demo1_sphere200','demo2_psf','demo3_rabbits','demo6_dicuq','demo7_dic_from_exodus','demo8_stereocal','demo9_feature_zoo'
          foreach ($demo in $demos) {
            & $python -m "riley.pydemos.$demo"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
