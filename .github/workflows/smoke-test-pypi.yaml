name: Smoke Test Published Package

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version to test from PyPI (leave blank for latest from pyproject.toml)'
        required: false
        default: ''
        type: string

jobs:
  smoke_test:
    name: Smoke test PyPI package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Determine package version
        id: package_version
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            version="${{ inputs.version }}"
          else
            version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          fi
          echo "Testing version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create clean environment (POSIX)
        if: runner.os != 'Windows'
        run: python -m venv "$RUNNER_TEMP/riley-pypi-smoke"

      - name: Create clean environment (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: python -m venv "$env:RUNNER_TEMP\riley-pypi-smoke"

      - name: Install from PyPI (POSIX)
        if: runner.os != 'Windows'
        run: |
          python="$RUNNER_TEMP/riley-pypi-smoke/bin/python"
          "$python" -m pip install --upgrade pip
          for attempt in 1 2 3 4 5 6 7 8; do
            "$python" -m pip install --index-url https://pypi.org/simple "riley-raster==${{ steps.package_version.outputs.version }}" && break
            [ "$attempt" -eq 8 ] && exit 1
            sleep 15
          done

      - name: Install from PyPI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $python = "$env:RUNNER_TEMP\riley-pypi-smoke\Scripts\python.exe"
          & $python -m pip install --upgrade pip
          for ($attempt = 1; $attempt -le 8; $attempt++) {
            & $python -m pip install --index-url https://pypi.org/simple "riley-raster==${{ steps.package_version.outputs.version }}"
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 8) { exit 1 }
            Start-Sleep -Seconds 15
          }

      - name: Verify installed package (POSIX)
        if: runner.os != 'Windows'
        working-directory: ${{ runner.temp }}
        run: "$RUNNER_TEMP/riley-pypi-smoke/bin/python -c 'import riley; print(riley.__file__)'"

      - name: Verify installed package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& "$env:RUNNER_TEMP\riley-pypi-smoke\Scripts\python.exe" -c "import riley; print(riley.__file__)"'

      - name: Run demos (POSIX)
        if: runner.os != 'Windows'
        working-directory: ${{ runner.temp }}
        run: |
          for demo in demo0_quickstart demo1_sphere demo2a_rabbits_mono demo2b_rabbits_rgb demo2c_rabbits_fields demo3_dicuq demo3_dicuq_from_exodus demo4_stereocal demo5_cameramodels demo6_featurezoo; do
            "$RUNNER_TEMP/riley-pypi-smoke/bin/python" -m "riley.pydemos.$demo"
          done

      - name: Run demos (Windows)
        if: runner.os == 'Windows'
        working-directory: ${{ runner.temp }}
        shell: pwsh
        run: |
          $python = "$env:RUNNER_TEMP\riley-pypi-smoke\Scripts\python.exe"
          $demos = 'demo0_quickstart','demo1_sphere','demo2a_rabbits_mono','demo2b_rabbits_rgb','demo2c_rabbits_fields','demo3_dicuq','demo3_dicuq_from_exodus','demo4_stereocal','demo5_cameramodels','demo6_featurezoo'
          foreach ($demo in $demos) {
            & $python -m "riley.pydemos.$demo"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
