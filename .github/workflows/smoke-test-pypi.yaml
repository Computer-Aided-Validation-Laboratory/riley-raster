name: Smoke Test Published Package

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  smoke_test:
    name: Smoke test PyPI package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # A reusable run inherits the release caller's SHA, matching the build jobs.
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install current wheel from PyPI and smoke test all CLI demos
        shell: bash
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          python -m venv .venv
          if [[ "$RUNNER_OS" == Windows ]]; then
            python=.venv/Scripts/python.exe
          else
            python=.venv/bin/python
          fi
          for attempt in {1..8}; do
            "$python" -m pip install --index-url https://pypi.org/simple --only-binary=riley-raster "riley-raster==$version" && break
            if [[ "$attempt" == 8 ]]; then
              exit 1
            fi
            sleep 15
          done
          "$python" -I scripts/smoke_pypi_demos.py
