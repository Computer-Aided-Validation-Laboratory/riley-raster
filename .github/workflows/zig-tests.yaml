name: Zig Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build library
        run: zig build -Doptimize=ReleaseFast --summary all

      - name: Build documentation
        if: matrix.os == 'ubuntu-latest'
        run: zig build docs

      - name: Run Zig Verification and Basic Tests
        run: zig build test-verif-basic -Doptimize=ReleaseSafe
