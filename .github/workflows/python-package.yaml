name: Python Package Build

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_test:
    name: Python Package Build & Test on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}
    # Allow extra time for Windows wheel builds and demo parity.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 90 || 45 }}

    steps:
      - uses: actions/checkout@v4

      - name: Reclaim runner disk space (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - name: Zig Setup
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Python install build tools and test dependencies
        run: |
          python -m pip install --upgrade pip build pytest

      - name: Python build distribution packages (wheel and sdist)
        shell: bash
        run: |
          rm -rf dist
          python -m build

      - name: Python install built wheel
        shell: bash
        run: |
          python -m pip install --force-reinstall dist/*.whl

      - name: Smoke test installed wheel and procedural CLI outputs
        # The packaged suite below already renders and checks the other demos.
        run: python -I scripts/smoke_pypi_demos.py --procedural-only

      - name: Test wheel smoke scripts
        run: python -m pytest scripts/tests/test_smoke_pypi_demos.py

      - name: Python run test suite
        run: |
          python -m pytest --pyargs riley.pytests -s
