[build-system]
requires = ["setuptools>=61.0", "wheel", "Cython", "numpy", "ziglang==0.16.0"]
build-backend = "setuptools.build_meta"

[project]
name = "riley-raster"
version = "2026.10.1"
description = "A Zig software rasteriser for DIC UQ."
authors = [
  { name = "scepticalrabbit (Lloyd Fletcher)", email = "thescepticalrabbit@gmail.com" },
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11.0"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
]
dependencies = [
  "netCDF4>=1.7.0",
  "numpy>=2.0.0",
  "Pillow>=10.0.0",
  "pytest>=9.0.0",
  "scipy>=1.14.0",
]

[project.urls]
"Repository" = "https://github.com/Computer-Aided-Validation-Laboratory/riley-raster"

[dependency-groups]
dev = [
  "build",
  "twine",
  "ziglang==0.16.0",
  "cython",
  "opencv-python-headless",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
riley = [
  "data/**/*",
]

[tool.setuptools.exclude-package-data]
riley = [
  "data/**/__pycache__/*",
  "data/**/.DS_Store",
]

[tool.pytest.ini_options]
testpaths = ["src/riley/pytests"]
filterwarnings = [
  "ignore:.*Setting the shape on a NumPy array.*:DeprecationWarning",
]

[tool.cibuildwheel.windows]
repair-wheel-command = "delvewheel repair -w {dest_dir} --add-path src\\riley\\cython -v {wheel}"
